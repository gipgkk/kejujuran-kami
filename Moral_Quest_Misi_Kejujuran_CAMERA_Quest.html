<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moral Quest — Misi Kejujuran Camera Quest</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff,#ecfeff,#fef3c7);min-height:100vh}.glass{background:#ffffffd9;backdrop-filter:blur(12px);box-shadow:0 12px 35px #0f172a18}.ans{transition:.18s}.ans:hover{transform:translateY(-2px)}.selected{outline:4px solid #60a5fa;background:#eff6ff}#camwrap{position:relative;overflow:hidden;border-radius:24px;background:#111827;aspect-ratio:16/10}#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#pointer{position:absolute;width:32px;height:32px;border:4px solid white;border-radius:50%;background:#3b82f6aa;box-shadow:0 0 0 7px #60a5fa44;display:none;transform:translate(-50%,-50%);pointer-events:none}#hold{position:absolute;left:8%;right:8%;bottom:12px;height:9px;background:#ffffff44;border-radius:9px;display:none;overflow:hidden}#fill{height:100%;width:0;background:#22c55e}</style></head>
<body class="text-slate-800"><div class="max-w-5xl mx-auto p-4 md:p-7"><header class="glass rounded-3xl p-5 mb-5 flex justify-between items-center gap-3"><div><b class="text-3xl text-indigo-700">🎯 MORAL QUEST</b><div class="font-semibold text-slate-500">Misi Kejujuran — Camera Quest</div></div><div class="flex gap-2 text-sm font-bold"><span class="bg-indigo-100 px-3 py-2 rounded-full">⭐ <b id="score">0</b></span><span class="bg-amber-100 px-3 py-2 rounded-full">🔥 <b id="combo">0</b></span><span class="bg-emerald-100 px-3 py-2 rounded-full">⚡ <b id="energy">100</b></span></div></header><main id="app"></main></div>
<script>
const Q=[
["Kamu ternampak wang tercicir di dalam kelas. Apakah tindakan yang jujur?",["Ambil dan simpan.","Serahkan kepada guru.","Biarkan sahaja.","Suruh kawan ambil."],[1],"Kejujuran bermaksud melakukan perkara yang benar walaupun tiada orang melihat."],
["Kamu terlupa menyiapkan kerja rumah. Apakah yang patut dilakukan?",["Menipu bahawa buku tertinggal.","Salin kerja kawan.","Beritahu guru dengan jujur.","Sembunyikan buku."],[2],"Mengakui kesilapan ialah tindakan jujur dan bertanggungjawab."],
["Kamu memecahkan pasu secara tidak sengaja. Apakah tindakan yang betul?",["Sembunyikan.","Salahkan adik.","Mengaku kepada ibu bapa.","Buat-buat tidak tahu."],[2],"Bercakap benar membantu masalah diselesaikan dengan baik."],
["Pilih SEMUA tindakan yang menunjukkan kejujuran.",["Pulangkan barang bukan milik kita.","Mengaku apabila melakukan kesalahan.","Menipu untuk mendapat hadiah.","Bercakap benar kepada guru."],[0,1,3],"Kejujuran termasuk bercakap benar, mengakui kesalahan dan menghormati hak orang lain."],
["Kawan mengajak kamu meniru jawapan. Apakah pilihan yang jujur?",["Beri jawapan.","Tolak dengan baik.","Tiru jawapan.","Tukar kertas."],[1],"Menolak perbuatan meniru menunjukkan integriti."],
["Apakah perasaan apabila kita bercakap benar?",["Tenang dan lega.","Takut kerana berbohong.","Marah.","Malu kerana menipu."],[0],"Bercakap benar boleh membuatkan kita berasa tenang dan lega."],
["Pilih SEMUA kepentingan bersikap jujur.",["Dipercayai orang lain.","Mewujudkan hubungan baik.","Menyebabkan orang takut.","Membina sikap bertanggungjawab."],[0,1,3],"Kejujuran membina kepercayaan, hubungan baik dan tanggungjawab."]
];
let n=0,score=0,combo=0,energy=100,mode="touch",picked=[],locked=false,stream=null,hands=null,face=null,running=false,hold=-1,started=0;
const app=document.getElementById("app");
function home(){stop();app.innerHTML=`<section class="glass rounded-3xl p-8 text-center"><div class="text-7xl">🛡️</div><h1 class="text-5xl font-black text-indigo-700 mt-3">MISI KEJUJURAN</h1><p class="text-lg text-slate-500 mt-2">Cabaran Masyarakat • Pendidikan Moral Tahun 5</p><div class="grid md:grid-cols-2 gap-4 max-w-2xl mx-auto mt-8"><button onclick="start('touch')" class="glass rounded-3xl p-6"><div class="text-5xl">👆</div><b class="text-xl">MOD SENTUH</b><p class="text-sm text-slate-500">Klik atau sentuh jawapan.</p></button><button onclick="start('camera')" class="glass rounded-3xl p-6"><div class="text-5xl">📷✋</div><b class="text-xl">CAMERA QUEST</b><p class="text-sm text-slate-500">Gerakkan jari telunjuk ke jawapan.</p></button></div><div class="bg-indigo-50 rounded-2xl p-4 mt-7 text-sm">💡 Dalam Camera Quest, wajah dan tangan dikesan terus dalam pelayar. Tahan jari pada jawapan selama kira-kira 1 saat untuk memilih.</div></section>`}
function start(m){mode=m;n=0;score=0;combo=0;energy=100;show()}
function show(){picked=[];locked=false;stop();let q=Q[n],multi=q[2].length>1;app.innerHTML=`<section class="glass rounded-3xl p-5"><div class="flex justify-between mb-4"><button onclick="home()" class="bg-white px-4 py-2 rounded-xl font-bold">← Menu</button><b>MISI ${n+1} / 7</b></div><div class="h-3 bg-slate-200 rounded-full mb-6"><div class="h-3 bg-indigo-500 rounded-full" style="width:${(n+1)/7*100}%"></div></div><div class="grid lg:grid-cols-5 gap-5"><div class="lg:col-span-3"><div class="bg-indigo-50 rounded-3xl p-6"><div class="text-5xl">🧠</div><h2 class="text-2xl font-black mt-3">${q[0]}</h2><p class="text-sm text-indigo-700 font-bold mt-3">${multi?"Pilih semua jawapan yang betul.":"Pilih satu jawapan yang paling tepat."}</p></div><div id="answers" class="grid gap-3 mt-5">${q[1].map((x,j)=>`<button class="ans bg-white rounded-2xl p-4 text-left font-bold flex gap-3 items-center" data-i="${j}" onclick="pick(${j})"><span class="w-9 h-9 bg-indigo-100 rounded-full flex items-center justify-center">${String.fromCharCode(65+j)}</span>${x}</button>`).join("")}</div><button id="submit" disabled onclick="submit()" class="w-full mt-4 py-4 rounded-2xl bg-indigo-600 text-white font-black disabled:opacity-40">${multi?"SAHKAN JAWAPAN":"PILIH JAWAPAN"}</button></div><div class="lg:col-span-2">${mode==="camera"?`<div class="bg-slate-900 rounded-3xl p-3 text-white sticky top-3"><div id="camwrap"><video id="cam" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="pointer"></div><div id="hold"><div id="fill"></div></div></div><div class="flex justify-between p-3 text-sm"><span id="faceStatus">🔎 Mencari wajah...</span><button onclick="mode='touch';show()" class="bg-white/15 px-3 py-2 rounded-xl">Mod Sentuh</button></div><p class="text-xs text-slate-300 px-3 pb-2">☝️ Tunjuk jari telunjuk ke pilihan jawapan dan tahan.</p></div>`:`<div class="bg-white rounded-3xl p-7 text-center"><div class="text-7xl">👆</div><b class="text-xl">Mod Sentuh</b><p class="text-sm text-slate-500 mt-2">Sesuai untuk komputer, tablet atau papan interaktif.</p></div>`}</div></div></section>`;if(mode==="camera")camera()}
function pick(j){if(locked)return;let multi=Q[n][2].length>1;if(multi){picked.includes(j)?picked=picked.filter(x=>x!==j):picked.push(j);document.querySelectorAll(".ans").forEach((b,k)=>b.classList.toggle("selected",picked.includes(k)));document.getElementById("submit").disabled=!picked.length}else{picked=[j];document.querySelectorAll(".ans").forEach((b,k)=>b.classList.toggle("selected",k===j));document.getElementById("submit").disabled=false;setTimeout(submit,150)}}
function submit(){if(locked||!picked.length)return;locked=true;stop();let a=[...picked].sort().join(","),b=[...Q[n][2]].sort().join(","),ok=a===b;if(ok){score+=100+combo*20;combo++;energy=Math.min(100,energy+5)}else{combo=0;energy=Math.max(0,energy-15)}document.getElementById("score").textContent=score;document.getElementById("combo").textContent=combo;document.getElementById("energy").textContent=energy;document.querySelectorAll(".ans").forEach((x,k)=>{if(Q[n][2].includes(k))x.classList.add("ring-4","ring-green-400");if(picked.includes(k)&&!Q[n][2].includes(k))x.classList.add("ring-4","ring-red-400")});app.insertAdjacentHTML("beforeend",`<div class="mt-5 bg-white rounded-3xl p-6 text-center"><div class="text-5xl">${ok?"🎉":"💡"}</div><h3 class="text-2xl font-black mt-2">${ok?"Betul!":"Mari belajar bersama!"}</h3><p class="mt-2">${Q[n][3]}</p><button onclick="next()" class="mt-4 bg-indigo-600 text-white font-black px-8 py-3 rounded-2xl">${n===6?"LIHAT KEJAYAAN":"MISI SETERUSNYA →"}</button></div>`)}
function next(){n++;n>=7?victory():show()}
function victory(){stop();app.innerHTML=`<section class="glass rounded-3xl p-8 text-center"><div class="text-8xl">🏆</div><h1 class="text-4xl font-black text-indigo-700">MISI SELESAI!</h1><p class="text-lg mt-2">Tahniah! Kamu telah menyelesaikan semua cabaran.</p><div class="grid grid-cols-3 gap-4 max-w-2xl mx-auto mt-7"><div class="bg-white rounded-2xl p-5"><b class="text-3xl">${score}</b><p>Mata</p></div><div class="bg-white rounded-2xl p-5"><b class="text-3xl">${combo}</b><p>Combo</p></div><div class="bg-white rounded-2xl p-5"><b class="text-3xl">${energy}</b><p>Tenaga</p></div></div><div class="bg-indigo-50 rounded-2xl p-5 mt-6"><b>❤️ Refleksi</b><p class="mt-2">Saya akan mengamalkan kejujuran walaupun tiada orang melihat.</p></div><button onclick="start(mode)" class="mt-6 bg-indigo-600 text-white font-black px-8 py-3 rounded-2xl">MAIN SEMULA</button></section>`}
async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:600}},audio:false});let v=document.getElementById("cam");v.srcObject=stream;await v.play();hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.6});hands.onResults(hand);face=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});face.setOptions({maxNumFaces:1,minDetectionConfidence:.55,minTrackingConfidence:.55});face.onResults(fr=>{let s=document.getElementById("faceStatus");if(s)s.textContent=fr.multiFaceLandmarks?.length?"🙂 Wajah dikesan":"🔎 Mencari wajah..."});running=true;loop()}catch(e){document.getElementById("faceStatus").textContent="⚠️ Kamera tidak tersedia — gunakan Mod Sentuh."}}
async function loop(){if(!running)return;let v=document.getElementById("cam");try{await hands.send({image:v});await face.send({image:v})}catch(e){}requestAnimationFrame(loop)}
function hand(r){let p=document.getElementById("pointer"),bar=document.getElementById("hold"),fill=document.getElementById("fill");if(!p)return;if(!r.multiHandLandmarks?.length){p.style.display="none";bar.style.display="none";hold=-1;return}let t=r.multiHandLandmarks[0][8],x=1-t.x,y=t.y;p.style.display="block";p.style.left=x*100+"%";p.style.top=y*100+"%";let wrap=document.getElementById("camwrap").getBoundingClientRect(),sx=wrap.left+x*wrap.width,sy=wrap.top+y*wrap.height;let e=document.elementFromPoint(sx,sy),b=e?.closest(".ans"),idx=b?+b.dataset.i:-1;if(idx<0){hold=-1;bar.style.display="none";return}b.classList.add("selected");if(hold!==idx){hold=idx;started=performance.now()}bar.style.display="block";let pct=Math.min(100,(performance.now()-started)/900*100);fill.style.width=pct+"%";if(pct>=100){pick(idx);hold=-1;bar.style.display="none"}}
function stop(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(hands){hands.close?.();hands=null}if(face){face.close?.();face=null}}
home();
</script></body></html>
